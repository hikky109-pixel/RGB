name: RGB Cycle Daily

on:
  schedule:
    - cron: '0 19 * * *'   # 日本時間 朝4時（UTC19時）
  workflow_dispatch:

jobs:
  post-rgb:
    runs-on: ubuntu-latest
    env:
      TZ: 'Asia/Tokyo'        # 日本時間に指定
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Run RGB cycle script
        run: python rgb_cycle.py
